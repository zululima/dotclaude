<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%232c6e5c'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* One column as wide as the window: the PR on top, which scrolls away, then the steps under a thin progress bar that stays. The focused step pushes the rest a window down, so it is alone on screen; scroll anchoring stays off so that margin moving does not drag the scroll with it. A step with pictures gives them all the room its text leaves: the script tries the text beside them and under them in columns and keeps the layout that shows them largest. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --ink: #1b2420;
  --muted: #5b6862;
  --line: #dce3df;
  --accent: #2c6e5c;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --code-bg: #eef2ef;
  --pass: #1f7a4d;
  --fail: #b42318;
  --warn: #a15c07;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #182019; --ink: #e3eae6; --muted: #98a59f; --line: #29332e;
    --accent: #63c2a2; --accent-ink: #0b1411; --accent-soft: #1d2e27; --code-bg: #1f2823;
    --pass: #5cc38e; --fail: #f2836f; --warn: #e3a64a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #182019; --ink: #e3eae6; --muted: #98a59f; --line: #29332e;
  --accent: #63c2a2; --accent-ink: #0b1411; --accent-soft: #1d2e27; --code-bg: #1f2823;
  --pass: #5cc38e; --fail: #f2836f; --warn: #e3a64a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; overflow-anchor: none;
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.layout { max-width: 2200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "pr" "main"; gap: 12px; padding-top: 16px; }
.rail-pr { grid-area: pr; }
.rail-pr .progress { display: none; }
.main { grid-area: main; }
.rail { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding-block: 8px; margin-top: -8px;
}
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 4px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-direction: column; gap: 4px; }
.ref { font: 500 12px/1.4 var(--mono); color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.ref a { color: inherit; }
h1 { font-size: 1.15rem; line-height: 1.3; margin: 0; font-weight: 600; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.progress { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
.count { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.save { font-size: 12px; color: var(--muted); min-height: 1em; }

h2 { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h3.sub { font-size: 0.95rem; margin: 14px 0 6px; }
.note { color: var(--muted); margin-bottom: 12px; }
.group { scroll-margin-top: calc(42px + env(safe-area-inset-top, 0px)); }
.note p { margin: 0 0 8px; }

.review { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13.5px; line-height: 1.5; }
.review h2 { margin-bottom: 4px; }
.review-sum { font-weight: 600; margin: 0 0 10px; font-size: 14px; }
.review p { margin: 0; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.result { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.result-detail { font-size: 12.5px; }
.pill { font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.04em; }
.result.pass .pill { color: var(--pass); }
.result.fail .pill { color: var(--fail); }
.result.skip .pill { color: var(--muted); }
.result-name { font-weight: 500; }
.result-detail { color: var(--muted); min-width: 0; }
.quiet { color: var(--muted); margin: 10px 0 0; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  scroll-margin-top: calc(42px + env(safe-area-inset-top, 0px)); outline: none;
}
.step.added { border-style: dashed; border-color: var(--warn); }
.step.finding { border-left: 4px solid var(--muted); }
.step.finding.high { border-left-color: var(--fail); }
.step.finding.medium { border-left-color: var(--warn); }
.step.focused { box-shadow: 0 0 0 2px var(--accent); border-color: transparent; margin-bottom: 100vh; }
.step.finding.high .step-label { color: var(--fail); }
.step.finding.medium .step-label { color: var(--warn); }
.missed { border-left: 3px solid var(--warn); padding: 2px 0 2px 10px; display: flex; flex-direction: column; gap: 4px; }
.missed-label { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--warn); }
.missed p { margin: 0; }
.hint { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; font-size: 12.5px; color: var(--muted); }
.c-hint { margin-left: auto; margin-right: 8px; text-transform: none; letter-spacing: 0; font: 400 12px var(--sans); }
.check {
  width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface);
  cursor: pointer; display: grid; place-items: center; margin-top: 2px; padding: 0;
}
.check::after { content: ""; width: 12px; height: 7px; border: solid var(--accent-ink); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.step.done .check { background: var(--accent); border-color: var(--accent); }
.step.done .check::after { opacity: 1; }
.step-label { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.step.added .step-label { color: var(--warn); }
.step-title { font-weight: 600; margin: 2px 0 6px; }
.step:not(.has-shots) .step-main, .group > .note, .review { max-width: 920px; }
.step-main { min-width: 0; }
.step.has-shots .step-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px 24px; align-items: start; align-content: start; }
.step[data-layout="side"] .step-main { grid-template-columns: var(--text-w, 380px) minmax(0, 1fr); grid-template-rows: auto 1fr; }
.step[data-layout="side"] .step-shots { grid-column: 2; grid-row: 1 / 3; }
.step[data-layout="side"] .step-head, .step[data-layout="side"] .step-body { grid-column: 1; }
.step-shots { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.step-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.step[data-layout="stack"] .step-body { display: block; column-count: var(--cols, 1); column-gap: 28px; }
.step[data-layout="stack"] .step-body > * { break-inside: avoid; margin-bottom: 10px; }
.step[data-layout="stack"] .step-body > :last-child { margin-bottom: 0; }
.step-body p { margin: 0; max-width: 68ch; }
.step-body ul { margin: 0; padding-left: 20px; }
.block { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.block-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 10px; font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 9px; font: 500 12px var(--sans); cursor: pointer; text-transform: none; letter-spacing: 0; }
.block pre { margin: 0; padding: 8px 12px 12px; overflow-x: auto; }
.block code { background: none; padding: 0; font-size: 13px; white-space: pre; }
.shot { margin: 0; }
.zoom { display: block; width: fit-content; border: 1px solid var(--line); border-radius: 8px; padding: 0; overflow: hidden; cursor: zoom-in; background: var(--bg); max-width: 100%; }
.zoom img { display: block; width: auto; height: auto; max-width: 100%; max-height: 60vh; }

#viewer { border: none; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
#viewer::backdrop { background: rgb(0 0 0 / 0.78); }
#viewer img { display: block; max-width: 96vw; max-height: 92vh; border-radius: 6px; cursor: zoom-out; }
kbd { font: 500 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--bg); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .fill, .toast { transition: none; } }
@media (max-width: 520px) {
  .step { grid-template-columns: 28px minmax(0, 1fr); padding: 12px; gap: 10px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="rail rail-pr">
    <header class="top">
      <div class="ref"><a href="{{PR_URL}}" target="_blank" rel="noopener">{{PR_REF}}</a><span>{{BRANCH}}</span><span>{{HEAD}}</span></div>
      <h1>{{PR_TITLE}}</h1>
      <div class="meta"><span>{{AUTHOR}}</span><span>{{BUILT}}</span></div>
      <div class="progress">
        <div class="track" aria-hidden="true"><div class="fill"></div></div>
        <span class="count" role="status">0 of 0 done</span>
      </div>
      <div class="save" id="save"></div>
    </header>
  </aside>
  <main class="main">
    <div class="bar progress" aria-hidden="true">
      <div class="track"><div class="fill"></div></div>
      <span class="count">0 of 0 done</span>
    </div>
    {{REVIEW}}
    {{SECTIONS}}
  </main>
</div>

<dialog id="viewer" aria-label="{{SCREENSHOT}}"><img alt=""></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const KEY = "{{STORAGE_KEY}}";
  const UI = {{UI_JSON}};
  const steps = [...document.querySelectorAll(".step")];
  const done = new Set();
  const fills = document.querySelectorAll(".fill");
  const counts = document.querySelectorAll(".count");
  const save = document.getElementById("save");
  const viewer = document.getElementById("viewer");
  const toastEl = document.getElementById("toast");
  const hint = document.createElement("div");
  hint.className = "hint";
  const copyHint = document.createElement("span");
  copyHint.className = "c-hint";
  copyHint.innerHTML = "<kbd>c</kbd> " + UI.copies;
  let focus = -1;

  function local(name, value) {
    try {
      if (value === undefined) return JSON.parse(localStorage.getItem(KEY + ":" + name));
      localStorage.setItem(KEY + ":" + name, JSON.stringify(value));
    } catch (e) {
      return null;
    }
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  function paint() {
    let n = 0;
    for (const el of steps) {
      const on = done.has(el.dataset.id);
      if (on) n++;
      el.classList.toggle("done", on);
      el.querySelector(".check").setAttribute("aria-checked", on ? "true" : "false");
    }
    for (const el of counts) el.textContent = UI.count.replace("%n", n).replace("%t", steps.length);
    for (const el of fills) el.style.width = (steps.length ? (n / steps.length) * 100 : 0) + "%";
  }

  function showKeys(el) {
    const keys = [["x", el.classList.contains("finding") ? UI.read : UI.done], ["j", UI.next], ["k", UI.back]];
    if (el.querySelector(".zoom img")) keys.push(["o", UI.screenshot]);
    hint.innerHTML = keys.map(([key, what]) => "<span><kbd>" + key + "</kbd> " + what + "</span>").join("");
    el.querySelector(".step-title").after(hint);
    const bar = el.querySelector(".block .block-bar");
    if (bar) bar.insertBefore(copyHint, bar.querySelector(".copy"));
    else copyHint.remove();
  }

  function setFocus(i, scroll) {
    if (!steps.length) return;
    focus = Math.max(0, Math.min(steps.length - 1, i));
    steps.forEach((el, k) => el.classList.toggle("focused", k === focus));
    showKeys(steps[focus]);
    fitShots();
    if (scroll) {
      const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      const el = steps[focus];
      const group = el.closest(".group");
      // A section's first step brings its heading and note along.
      (group.querySelector(".step") === el ? group : el).scrollIntoView({ block: "start", behavior: smooth ? "smooth" : "auto" });
    }
  }

  // A step fits one window, and its pictures get all of it the text leaves. Each layout is tried,
  // the text beside the pictures at three widths and under them in one to three columns, and the
  // one that shows the pictures largest stays. o shows one full size.
  const LAYOUTS = [["stack", 1], ["stack", 2], ["side", 400], ["stack", 3], ["side", 320], ["side", 480]];
  const MAX_SCALE = 1.5;

  function setLayout(el, kind, n) {
    el.dataset.layout = kind;
    el.style.setProperty("--cols", kind === "stack" ? n : 1);
    el.style.setProperty("--text-w", kind === "side" ? n + "px" : "0px");
  }

  function fitShots() {
    const hintHeight = hint.isConnected ? hint.offsetHeight + parseFloat(getComputedStyle(hint).marginBottom) : 32;
    for (const el of steps) {
      const imgs = [...el.querySelectorAll(".step-shots .zoom img")];
      if (!imgs.length || imgs.some((img) => !img.naturalWidth)) continue;
      const main = el.querySelector(".step-main");
      const head = el.querySelector(".step-head");
      const body = el.querySelector(".step-body");
      const group = el.closest(".group");
      const lead = group.querySelector(".step") === el ? el.getBoundingClientRect().top - group.getBoundingClientRect().top : 0;
      const margin = parseFloat(getComputedStyle(lead ? group : el).scrollMarginTop) || 0;
      const frame = el.getBoundingClientRect().height - main.getBoundingClientRect().height;
      const room = innerHeight - margin - lead - frame - 16;
      const gaps = (imgs.length - 1) * 10 + imgs.length * 2;
      let best = null;
      for (const [kind, n] of LAYOUTS) {
        setLayout(el, kind, n);
        const width = main.clientWidth;
        const headHeight = head.offsetHeight + (el.contains(hint) ? 0 : hintHeight);
        const text = body.offsetHeight ? body.offsetHeight + 10 : 0;
        let w, h;
        if (kind === "side") {
          w = width - n - 24 - 2;
          h = room - gaps;
          if (w < 280 || headHeight + text > room) continue;
        } else {
          if (n > 1 && (width + 28) / n - 28 < 300) continue;
          w = width - 2;
          h = room - headHeight - 10 - text - gaps;
        }
        const scale = Math.max(0, Math.min(MAX_SCALE, ...imgs.map((img) => w / img.naturalWidth), h / imgs.reduce((sum, img) => sum + img.naturalHeight, 0)));
        if (!best || scale > best.scale * 1.03) best = { kind, n, scale, w };
      }
      setLayout(el, best.kind, best.n);
      for (const img of imgs) {
        // Text too long for the window keeps a small picture and scrolls.
        const width = Math.max(best.scale * img.naturalWidth, Math.min(best.w, MAX_SCALE * img.naturalWidth, (160 * img.naturalWidth) / img.naturalHeight));
        img.style.width = Math.floor(width) + "px";
        img.style.maxHeight = "none";
      }
    }
  }

  function toggle(i) {
    const id = steps[i].dataset.id;
    const on = !done.has(id);
    if (on) done.add(id); else done.delete(id);
    paint();
    local("done", [...done]);
    return on;
  }

  function copyFrom(container) {
    const code = container.querySelector(".block code");
    if (!code) { toast(UI.noCommand); return; }
    const text = code.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast(UI.copied), () => selectText(code));
    } else {
      selectText(code);
    }
  }

  function selectText(node) {
    const range = document.createRange();
    range.selectNodeContents(node);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast(UI.selected);
  }

  function openImage(container) {
    const img = container.querySelector(".zoom img");
    if (!img) { toast(UI.noScreenshot); return; }
    viewer.querySelector("img").src = img.src;
    viewer.querySelector("img").alt = img.alt;
    viewer.showModal();
  }

  document.addEventListener("click", (e) => {
    const check = e.target.closest(".check");
    const copy = e.target.closest(".copy");
    const zoom = e.target.closest(".zoom");
    const jump = e.target.closest(".to-step");
    const step = e.target.closest(".step");
    if (step) { const i = steps.indexOf(step); setFocus(i, i !== focus); }
    if (check) toggle(steps.indexOf(step));
    else if (copy) copyFrom(copy.closest(".block"));
    else if (zoom) openImage(zoom.closest(".shot"));
    else if (jump) {
      e.preventDefault();
      const i = steps.findIndex((el) => el.dataset.id === jump.dataset.step);
      if (i >= 0) setFocus(i, true);
    }
  });
  viewer.addEventListener("click", () => viewer.close());

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    if (viewer.open) return;
    const here = focus >= 0 ? steps[focus] : null;
    const pick = () => toast(UI.pick);
    switch (e.key) {
      case "j": setFocus(focus + 1, true); break;
      case "k": setFocus(focus < 0 ? 0 : focus - 1, true); break;
      case "x": if (!here) pick(); else if (toggle(focus)) setFocus(focus + 1, true); break;
      case "c": if (here) copyFrom(here); else pick(); break;
      case "o": if (here) openImage(here); else pick(); break;
      default: return;
    }
    e.preventDefault();
  });

  for (const id of local("done") || []) done.add(id);
  paint();
  fitShots();
  addEventListener("resize", fitShots);
  document.fonts.ready.then(fitShots);
  for (const img of document.querySelectorAll(".zoom img")) img.addEventListener("load", fitShots);
  // Start on the first step not done, so c and x work without a j first.
  const first = steps.findIndex((el) => !done.has(el.dataset.id));
  setFocus(first < 0 ? 0 : first, first > 0);

  try {
    localStorage.setItem(KEY + ":probe", "1");
    localStorage.removeItem(KEY + ":probe");
  } catch (e) {
    save.textContent = UI.noStorage;
  }
})();
</script>
</body>
</html>
